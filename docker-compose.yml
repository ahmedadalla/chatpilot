version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatpilot
      POSTGRES_USER: chatpilot_migrator
      POSTGRES_PASSWORD: migrator_secret_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chatpilot_migrator -d chatpilot']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatpilot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: compose/Dockerfile.api
    container_name: chatpilot-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      DATABASE_URL_MIGRATOR: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_signing_key_at_least_32_characters_long_for_security
      DEFAULT_COUNTRY: EG
      DEFAULT_CURRENCY: EGP
      DEFAULT_TIMEZONE: Africa/Cairo
      DEFAULT_LOCALE: ar-EG
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: compose/Dockerfile.worker
    container_name: chatpilot-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      DATABASE_URL_MIGRATOR: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_signing_key_at_least_32_characters_long_for_security
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  whatsapp-worker:
    build:
      context: .
      dockerfile: compose/Dockerfile.whatsapp-worker
    container_name: chatpilot-whatsapp-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WHATSAPP_WORKER_PORT: 3002
      DATABASE_URL: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      DATABASE_URL_MIGRATOR: postgresql://chatpilot_migrator:migrator_secret_pass@postgres:5432/chatpilot?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_signing_key_at_least_32_characters_long_for_security
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: compose/Dockerfile.web
    container_name: chatpilot-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
