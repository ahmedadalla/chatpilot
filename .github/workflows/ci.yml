name: ChatPilot CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Lint Gates & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.7.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Check code formatting
        run: pnpm format:check

      - name: Security Lint Gates (Gates A, B, C)
        run: pnpm lint

      - name: TypeScript Strict Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test:unit

      - name: Integration Test Suites (RLS, Auth, Isolation, Orders, WhatsApp, AI, Analytics)
        run: pnpm test:integration

      - name: End-to-End Scenarios Test Suite
        run: pnpm test:e2e

      - name: Build Monorepo Workspaces
        run: pnpm build
